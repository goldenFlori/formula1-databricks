      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: 01_ingest_circuits_file
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          email_notifications: {}
          webhook_notifications: {}
          disabled: false
          notebook_task:
            notebook_path: ./formula1-project-incremental-load/02-bronze/01.Ingest Circuits File
            source: WORKSPACE
